[package]
name = "crystal-packing-cli"
version = "0.6.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
description = "Command line interface for finding dense packings of shapes in 2D crystals."

[dependencies]
crystal_packing = { path = "../crystal-packing" }
log = "0.4"
env_logger = "0.11"
clap = { version = "4.5", features = ["derive"] }
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
svg = "0.18"
indicatif = "0.18"

[[bin]]
name = "packing"
path = "src/main.rs"
