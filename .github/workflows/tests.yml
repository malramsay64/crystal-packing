name: Test Suite

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Run tests
        run: cargo test --workspace

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install 1.88 --profile minimal --target wasm32-unknown-unknown
          rustup default 1.88
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Check
        run: |
          cargo check --workspace --all-targets
          cargo check -p crystal-packing-wasm --target wasm32-unknown-unknown

  regression:
    name: Slow suites (release)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Every test marked #[ignore] for being slow, across the workspace, so new suites run
      # without being listed here: known packings, adversarial shapes, unconstrained packings,
      # containers, strips and clusters, distinct structures and known geometries
      - name: Run the slow suites
        run: cargo test --release --workspace -- --ignored --nocapture

  wasm:
    name: WebAssembly
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
          rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install wasm-bindgen
        run: |
          VERSION=$(grep -A1 'name = "wasm-bindgen"' Cargo.lock | grep version | cut -d'"' -f2)
          cargo install wasm-bindgen-cli --version "$VERSION" --locked
      - name: Build
        run: crystal-packing-wasm/build.sh node
      - name: Native and wasm give identical results
        run: |
          cargo run --release --example determinism -p crystal_packing > reference.json
          node crystal-packing-wasm/tests/determinism.mjs reference.json
      - name: Browser search
        working-directory: crystal-packing-wasm
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:browser

  bench:
    name: Benchmarks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Run benchmarks briefly
        run: cargo bench -p crystal_packing --bench engine -- --warm-up-time 1 --measurement-time 1
