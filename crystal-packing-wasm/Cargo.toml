[package]
name = "crystal-packing-wasm"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/malramsay64/crystal-packing"
description = "WebAssembly bindings for finding dense packings of shapes in 2D crystals."
readme = "./README.md"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
crystal_packing = { path = "../crystal-packing" }
wasm-bindgen = "0.2"
serde_json = "1.0"
console_error_panic_hook = "0.1"

[dev-dependencies]
wasm-bindgen-test = "0.3"
